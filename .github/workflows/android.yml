name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install native tools
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Fetch portable SPC core
        run: git clone --depth 1 --branch 0.6.4 https://github.com/libgme/game-music-emu.git app/src/main/cpp/game-music-emu
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SPCPlay-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
